[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratory-instrument-selection"
version = "0.1.0"
description = "Evidence-grounded laboratory instrument selection workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100", "uvicorn>=0.20", "python-multipart>=0.0.9"]

[project.optional-dependencies]
parsing = ["docling>=2.0", "onnxruntime>=1.20", "rapidocr>=3", "pypdf>=5", "pymupdf>=1.24", "pdfplumber>=0.11", "pillow>=10", "openpyxl>=3.1"]
# What ``pytest tests`` needs in CI: the light half of ``parsing``, because
# several suite entries build real PDFs and read real tables. Docling, RapidOCR
# and onnxruntime are deliberately absent — they are the heavy optional stack,
# and the tests that exercise them skip themselves when the import fails. Run
# ``pip install -e ".[parsing]"`` before touching the document parser.
test = [
    "pytest>=8",
    "httpx>=0.24",
    "pymupdf>=1.24,<2",
    "pillow>=10",
    "pypdf>=5,<7",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
]
browser = ["playwright>=1.50,<2"]
# Optional TLS-impersonating transport for WAF-protected hosts. Off unless
# LAB_IMPERSONATE_HTTP=1 and the package is importable, so the default install
# and the deploy path are unchanged.
impersonate = ["curl_cffi>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
